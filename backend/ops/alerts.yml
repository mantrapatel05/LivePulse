groups:
  - name: livepulse_pipeline_alerts
    rules:
      - alert: LivePulseStreamBacklogHigh
        expr: livepulse_stream_pending_count > 5000
        for: 5m
        labels:
          severity: warning
          service: livepulse-pipeline
        annotations:
          summary: "Redis Stream events:v2 pending backlog is high"
          description: "Pending entries count is {{ $value }} (above threshold of 5000) for more than 5 minutes. The worker may be struggling to drain events to ClickHouse."

      - alert: LivePulseStreamBacklogCritical
        expr: livepulse_stream_pending_count > 20000
        for: 2m
        labels:
          severity: critical
          service: livepulse-pipeline
        annotations:
          summary: "Redis Stream events:v2 pending backlog is critical"
          description: "Pending entries count is {{ $value }} (above critical threshold 20000). ClickHouse ingestion worker may be stalled or crashed."

      - alert: LivePulseDeadLetterQueueActivity
        expr: rate(livepulse_dead_lettered_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
          service: livepulse-pipeline
        annotations:
          summary: "Events are being moved to the dead-letter stream"
          description: "Events exhausted delivery attempts and were moved to the dead-letter stream. Check for poison pills or invalid payloads."

      - alert: LivePulseHighEventRejectionRate
        expr: rate(livepulse_events_rejected_total[5m]) > 50
        for: 5m
        labels:
          severity: warning
          service: livepulse-collector
        annotations:
          summary: "High event validation rejection rate at collector"
          description: "Collector is rejecting {{ $value }} events/sec due to schema or validation failures."

      - alert: LivePulseHighRateLimitHits
        expr: rate(livepulse_rate_limited_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
          service: livepulse-collector
        annotations:
          summary: "High rate of 429 rate limit rejections"
          description: "Rate limiter is rejecting {{ $value }} requests/sec. Possible client retry storm or API abuse."

      - alert: LivePulseHighHttp5xxRate
        expr: sum(rate(livepulse_http_requests_total{status_code=~"5.."}[5m])) > 1
        for: 5m
        labels:
          severity: warning
          service: livepulse-api
        annotations:
          summary: "LivePulse API is returning many server errors"
          description: "The API has returned more than one 5xx response per second for five minutes."

      - alert: LivePulseHttpRequestLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(livepulse_http_request_duration_ms_bucket[5m]))) > 1000
        for: 5m
        labels:
          severity: warning
          service: livepulse-api
        annotations:
          summary: "LivePulse HTTP request p95 latency exceeds 1s"
          description: "The API request p95 has exceeded 1s for five minutes."

      - alert: LivePulseClickhouseInsertLatencyHigh
        expr: histogram_quantile(0.95, rate(livepulse_clickhouse_insert_latency_ms_bucket[5m])) > 1000
        for: 5m
        labels:
          severity: warning
          service: livepulse-worker
        annotations:
          summary: "ClickHouse batch insert p95 latency exceeds 1s"
          description: "ClickHouse insert p95 latency is currently {{ $value }}ms, which exceeds the 1000ms threshold."

      - alert: LivePulseAnalyticsQueryLatencyHigh
        expr: histogram_quantile(0.95, rate(livepulse_query_latency_ms_bucket[5m])) > 2500
        for: 5m
        labels:
          severity: warning
          service: livepulse-api
        annotations:
          summary: "Dashboard analytics query p95 latency exceeds 2.5s"
          description: "Analytics queries are slow (p95 latency {{ $value }}ms). Check ClickHouse load and materialized views."

      - alert: LivePulseAiInsightDegradedHigh
        expr: (sum(rate(livepulse_ai_insight_requests_total{result=~"degraded|error"}[10m])) / clamp_min(sum(rate(livepulse_ai_insight_requests_total[10m])), 0.001)) > 0.25
        for: 10m
        labels:
          severity: warning
          service: livepulse-api
        annotations:
          summary: "AI insight degradation or errors exceed 25%"
          description: "More than 25% of AI insight requests have degraded or errored over the last 10 minutes. Check provider availability and API configuration."

      - alert: LivePulseAiInsightLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(livepulse_ai_insight_latency_ms_bucket[5m]))) > 12000
        for: 10m
        labels:
          severity: warning
          service: livepulse-api
        annotations:
          summary: "AI insight p95 latency exceeds 12 seconds"
          description: "AI insight provider latency p95 is above 12 seconds. Check provider health and model response times."

      - alert: LivePulseDigestSendFailures
        expr: increase(livepulse_digest_sends_total{result="failed"}[1h]) > 3
        for: 0m
        labels:
          severity: warning
          service: livepulse-digest
        annotations:
          summary: "Weekly digest sends are failing"
          description: "More than 3 digest sends failed in the last hour. Check EMAIL_API_KEY, the sender domain and provider status."

      - alert: LivePulseNlqInvalidSpecHigh
        expr: |
          (sum(rate(livepulse_nlq_requests_total{result="invalid_spec"}[15m]))
            / clamp_min(sum(rate(livepulse_nlq_requests_total[15m])), 0.001)) > 0.3
          and sum(increase(livepulse_nlq_requests_total[15m])) > 10
        for: 15m
        labels: { severity: warning, service: livepulse-api }
        annotations:
          summary: "More than 30% of natural-language questions produce an invalid spec"
          description: "The model is returning specs that fail validation. Check LLM_MODEL, the translation prompt, and provider health."
