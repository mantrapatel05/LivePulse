global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: livepulse-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:5000"]
    # In production, configure Bearer auth using the same METRICS_TOKEN as the API:
    # authorization:
    #   type: Bearer
    #   credentials_file: /etc/prometheus/secrets/metrics_token

  - job_name: livepulse-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9464"]
    # In production, configure Bearer auth using the same METRICS_TOKEN as the worker:
    # authorization:
    #   type: Bearer
    #   credentials_file: /etc/prometheus/secrets/metrics_token

  - job_name: livepulse-digest
    metrics_path: /metrics
    static_configs:
      - targets: ["digest:9465"]
